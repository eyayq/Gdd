name: Update Tai

on:
  schedule:
    - cron: '0 * * * *' # Otomatis jalan tiap 1 jam sekali bangsat
  workflow_dispatch:    # Biar lu bisa klik tombol 'Run' manual kalau nafsu

jobs:
  update_playlist:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Python Script
        run: python tai.py

      - name: Commit and Push M3U
        run: |
          git config --global user.name "AutoUpdater-Bangsat"
          git config --global user.email "actions@github.com"
          git add tai.m3u
          git commit -m "Update Duel Maut [$(date)]" || exit 0
          git push
          
