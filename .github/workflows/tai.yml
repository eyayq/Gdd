name: Pro API Interceptor 2026

on:
  workflow_dispatch:

jobs:
  intercept-scan:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          # Install library dasar yang wajib ada buat Chrome terbaru
          sudo apt-get install -y libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 libxrandr2 libgbm1 libasound2t64

      - name: Install SeleniumBase
        run: |
          pip install seleniumbase
          # Paksa install driver chrome yang cocok
          sbase install chromedriver

      - name: Run Interceptor Script
        # Pakai perintah ini biar browser bisa jalan di background tanpa layar
        run: python tai.py

      - name: Upload Hasil Scan API
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hasil-tempur-api
          path: hasil_scan.txt
