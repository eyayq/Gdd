name: Pro API Scanner 2026

on:
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Chrome & Dependencies
        run: |
          sudo apt-get update
          pip install seleniumbase

      - name: Run Stealth Scanner
        run: python tai.py

      - name: Upload Hasil
        uses: actions/upload-artifact@v4
        with:
          name: hasil-tempur
          path: hasil_scan.txt
