name: ScraperSiluman
on: [workflow_dispatch] # Jalankan manual biar gak dicurigai

jobs:
  sikat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Tor & Python
        run: |
          sudo apt-get update
          sudo apt-get install -y tor
          pip install curl_cffi
      - name: Jalankan Tor
        run: sudo service tor start && sleep 10 # Tunggu Tor konek
      - name: Eksekusi Script
        run: python tai.py
