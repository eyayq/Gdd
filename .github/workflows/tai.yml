name: SikatIframeBrutal
on: [workflow_dispatch]

jobs:
  eksekusi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install WARP & Tools (Anti-Gagal)
        run: |
          # 1. Inject GPG Key Cloudflare secara manual biar gak drama GPG Error
          curl -fsSL https://pkg.cloudflareclient.com | sudo gpg --yes --dearmor -o /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg
          
          # 2. Tambahin Repo
          echo "deb [signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/cloudflare-client.list
          
          # 3. Update & Install WARP + XVFB
          sudo apt-get update
          sudo apt-get install cloudflare-warp xvfb -y
          
          # 4. Install Library Python Tempur
          pip install curl_cffi playwright
          playwright install chromium

      - name: Konek ke Jaringan Cloudflare
        run: |
          # Register & Konek WARP
          warp-cli --accept-tos registration new
          warp-cli --accept-tos mode proxy
          warp-cli --accept-tos connect
          
          # Tunggu koneksi sampe IP beneran ganti
          echo "Tunggu koneksi WARP..."
          for i in {1..10}; do
            if curl -x socks5://127.0.0.1:4000 -s https://ifconfig.me > /dev/null; then
              echo "✅ WARP Konek! IP: $(curl -x socks5://127.0.0.1:4000 -s https://ifconfig.me)"
              break
            fi
            sleep 3
          done

      - name: Jalankan Scraper SIKAT
        run: |
          # Jalankan pake xvfb-run biar dikira ada monitor beneran
          xvfb-run python tai.py
