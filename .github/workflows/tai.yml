name: Auto Update M3U Playlist

on:
  schedule:
    # Jalan tiap 1 jam sekali (biar jam WIB di group-title update terus)
    - cron: '0 * * * *'
  workflow_dispatch: # Biar bisa lu klik "Run" manual di GitHub

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    - name: Install Dependencies
      run: |
        pip install requests

    - name: Run Brutal Scraper
      run: |
        # Jalanin script dan simpan output ke playlist.m3u
        python tai.py > playlist.m3u

    - name: Commit and Push if Changed
      run: |
        git config --global user.name "M3U-Bot"
        git config --global user.email "bot@github.com"
        git add playlist.m3u
        git commit -m "Auto Update Playlist [$(date +'%Y-%m-%d %H:%M')] - Gak Cupu" || exit 0
        git push
