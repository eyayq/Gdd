name: Auto API Scanner

on:
  workflow_dispatch: # Biar bisa kamu klik manual "Run Workflow"
  schedule:
    - cron: '0 * * * *' # Jalan otomatis tiap jam kalau mau

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/set-up-python@v4
      with:
        python-version: '3.9'

    - name: Install Dependencies
      run: pip install requests

    - name: Run Scanner
      run: python scanner.py

    - name: Upload Hasil Scan
      uses: actions/upload-artifact@v4
      with:
        name: api-endpoints-target
        path: hasil_scan.txt
