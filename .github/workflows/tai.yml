name: Auto API Scanner

on:
  workflow_dispatch:
  schedule:
    - cron: '0 * * * *'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5 # Versi terbaru v5 biar makin gacor
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        pip install requests beautifulsoup4 cloudscraper

    - name: Run Scanner
      run: python tai.py

    - name: Upload Hasil Scan
      uses: actions/upload-artifact@v4
      with:
        name: api-endpoints-target
        path: hasil_scan.txt
