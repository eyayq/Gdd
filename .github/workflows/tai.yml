name: SikatIframeFinal
on: [workflow_dispatch]

jobs:
  tempur:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install WARP & Playwright
        run: |
          # 1. Install Cloudflare WARP
          curl -fsSL https://pkg.cloudflareclient.com | sudo gpg --yes --dearmor --output /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg
          echo "deb [arch=amd64 signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com $(ls_release -cs) main" | sudo tee /etc/apt/sources.list.d/cloudflare-client.list
          sudo apt-get update
          sudo apt-get install cloudflare-warp xvfb -y
          
          # 2. Install Python Deps & Browser
          pip install playwright playwright-stealth curl_cffi
          playwright install chromium
          sudo playwright install-deps chromium

      - name: Start WARP Tunnel
        run: |
          sudo systemctl start warp-svc
          sleep 2
          warp-cli --accept-tos registration new
          warp-cli --accept-tos mode proxy
          warp-cli --accept-tos connect
          
          # Tunggu sampe konek (Max 30 detik)
          for i in {1..10}; do
            if warp-cli --accept-tos status | grep -q "Connected"; then
              echo "✅ WARP IDUP BANGSAT!"
              break
            fi
            sleep 3
          done
          curl -x socks5h://127.0.0.1:4000 -s https://ifconfig.me || echo "IP Gagal Ganti"

      - name: Eksekusi Scraper
        # Pake xvfb-run biar browser nganggep ada layar
        run: xvfb-run python tai.py
