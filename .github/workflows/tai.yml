name: SikatIframeDajjal
on: [workflow_dispatch]

jobs:
  eksekusi_brutal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install WARP Tanpa GPG Drama
        run: |
          # Tambahin repo pake mode TRUSTED biar gak nanya kunci GPG bangsat
          echo "deb [trusted=yes] https://pkg.cloudflareclient.com $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/cloudflare-client.list
          sudo apt-get update
          sudo apt-get install cloudflare-warp xvfb -y
          pip install curl_cffi playwright
          playwright install chromium

      - name: Konek WARP (Ganti IP Azure ke Cloudflare)
        run: |
          warp-cli --accept-tos registration new
          warp-cli --accept-tos mode proxy
          warp-cli --accept-tos connect
          echo "Tunggu koneksi WARP stabil..."
          sleep 15
          # Cek IP, kalau berhasil harusnya IP Cloudflare
          curl -x socks5://127.0.0.1:4000 -s https://ifconfig.me || echo "Gagal ganti IP anjing"

      - name: Eksekusi Script Scraper
        run: xvfb-run python tai.py
