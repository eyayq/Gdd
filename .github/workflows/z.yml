name: z

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  z:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: |
          pip install requests pyyaml

      - run: |
          python z.py

      - run: |
          git config --global user.name "zbot"
          git config --global user.email "z@users.noreply.github.com"
          git add z.m3u
          git commit -m "update" || echo "no change"
          git push
