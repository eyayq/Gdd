name: XOILAC LIVE SCRAPER

on:
  workflow_dispatch:
  schedule:
    - cron: "*/10 * * * *"

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install aiohttp

      - name: Run Scraper
        run: |
          python z.py

      - name: Upload Playlist Artifact
        uses: actions/upload-artifact@v4
        with:
          name: playlist
          path: z.m3u

      - name: Commit Playlist
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"

          git add z.m3u

          git diff --quiet && git diff --staged --quiet || git commit -m "Update playlist $(date)"

          git push
