name: Run Z Playlist

on:
  schedule:
    - cron: '0 * * * *'   # tiap jam
  workflow_dispatch:       # bisa run manual

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install aiohttp

      - name: Run z.py
        run: python z.py

      - name: Upload z.m3u artifact
        uses: actions/upload-artifact@v3
        with:
          name: playlist
          path: z.m3u
