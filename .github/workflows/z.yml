name: xoilac scraper

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.11

      - name: Install deps
        run: pip install aiohttp

      - name: Run script
        run: python z.py

      - name: Upload playlist
        uses: actions/upload-artifact@v4
        with:
          name: playlist
          path: z.m3u
