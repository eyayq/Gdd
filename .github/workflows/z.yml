name: Live Match Scraper

# Trigger: setiap push atau jadwal cron
on:
  push:
    branches:
      - main
  schedule:
    # Jalankan tiap 10 menit (cron GitHub Actions pakai UTC)
    - cron: "*/10 * * * *"

jobs:
  scrape_live_matches:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repo (wajib)
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2. Install dependencies (jika pakai Python)
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.11

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests jq

      # 3. Jalankan script Python untuk scrape API
      - name: Run live match scraper
        run: |
          echo "Fetching live matches..."
          python z.py
