name: Sikat Playlist Anime WARP Fix

on:
  workflow_dispatch: 

jobs:
  update-m3u:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    # PASANG WARP MANUAL, JANGAN PAKE LIBRARY ANJING TADI
    - name: Install & Connect Cloudflare WARP
      run: |
        curl -fsSl https://pkg.cloudflareclient.com | sudo gpg --yes --dearmor --output /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg
        echo "deb [arch=amd64 signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/cloudflare-client.list
        sudo apt-get update && sudo apt-get install cloudflare-warp -y
        warp-cli --accept-tos registration new
        warp-cli --accept-tos mode proxy
        warp-cli --accept-tos connect
        sleep 10
        curl -s https://www.cloudflare.com | grep ip # Cek apakah IP udah ganti

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install playwright playwright-stealth
        playwright install chromium
        playwright install-deps chromium

    - name: Run Script
      run: |
        xvfb-run python ensrip.py

    - name: Commit & Push Playlist
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        git add playlist.m3u
        git commit -m "Auto Update Playlist with WARP Fix" || echo "No changes"
        git push
