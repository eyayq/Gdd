name: Sikat Playlist Anime

on:
  workflow_dispatch: 
  schedule:
    - cron: '0 */6 * * *'

jobs:
  update-m3u:
    runs-on: ubuntu-latest

    # Izin buat nge-push file hasil ke repo
    permissions:
      contents: write

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install playwright playwright-stealth
        playwright install chromium
        playwright install-deps chromium

    - name: Run Script
      run: |
        # xvfb-run biar Playwright berasa punya layar monitor
        xvfb-run python ensrip.py

    - name: Commit & Push Playlist
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        git add playlist.m3u
        git commit -m "Auto Update Playlist: $(date)" || echo "No changes"
        git push
