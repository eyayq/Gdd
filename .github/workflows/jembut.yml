name: Sikat Playlist Anime WARP

on:
  workflow_dispatch: 

jobs:
  update-m3u:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    # INI KUNCINYA, BANGSAT! PASANG WARP BIAR IP BERSIH
    - name: Set up WARP
      uses: fscarmen/warp-on-actions@v1.1
      with:
        stack: ipv4 # Pakai IPv4 biar standar

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install playwright playwright-stealth
        playwright install chromium
        playwright install-deps chromium

    - name: Run Script
      run: |
        xvfb-run python ensrip.py

    - name: Commit & Push Playlist
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        git add playlist.m3u
        git commit -m "Auto Update Playlist with WARP" || echo "No changes"
        git push
