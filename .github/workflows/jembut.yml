name: Sikat Pakai Browser Asli
on:
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Tools & Browser
        run: |
          pip install playwright playwright-stealth
          playwright install chromium

      - name: Eksekusi Siluman
        run: python ensrip.py

      - name: Upload M3U
        uses: actions/upload-artifact@v4
        with:
          name: m3u-siluman
          path: playlist.m3u
