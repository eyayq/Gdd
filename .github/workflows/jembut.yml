name: Sikat Playlist Anime

on:
  workflow_dispatch: # Biar bisa lu klik "Run" manual dari menu Actions
  schedule:
    - cron: '0 */6 * * *' # Otomatis jalan tiap 6 jam biar playlist seger

jobs:
  gas-ken:
    runs-on: ubuntu-latest

    steps:
    - name: Ambil Code
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Semua Bahan
      run: |
        python -m pip install --upgrade pip
        pip install playwright playwright-stealth
        playwright install chromium
        playwright install-deps chromium

    - name: Eksekusi Script
      run: |
        # Pakai xvfb-run biar Playwright gak bingung di server tanpa monitor
        xvfb-run python ensrip.py

    - name: Upload Hasil ke Artifact
      uses: actions/upload-artifact@v4
      with:
        name: hasil-playlist
        path: playlist.m3u

    - name: Commit dan Push Hasil
      run: |
        git config --local user.email "actions@github.com"
        git config --local user.name "GitHub Action"
        git add playlist.m3u
        git commit -m "Update Playlist: $(date)" || echo "Gak ada perubahan"
        git push
