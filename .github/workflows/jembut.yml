name: Auto M3U Generator
on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *' # Jalan otomatis tiap 6 jam biar playlist update terus

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Jamu
        run: pip install cloudscraper

      - name: Eksekusi Script
        run: python ensrip.py

      - name: Upload Hasil M3U
        uses: actions/upload-artifact@v4
        with:
          name: playlist-m3u-terbaru
          path: update.m3u
